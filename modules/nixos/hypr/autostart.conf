# Autostart commands for Hyprland services, Noctalia, and session environment setup.

# Ensure portal services see the Wayland/XDG env, then restart them.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY XDG_SESSION_TYPE XDG_SESSION_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY XDG_SESSION_TYPE XDG_SESSION_DESKTOP
exec-once = systemctl --user restart xdg-desktop-portal.service xdg-desktop-portal-gtk.service xdg-desktop-portal-hyprland.service

# Noctalia shell - provides bar, notifications, launcher, wallpaper, idle/lock
exec-once = noctalia-shell

# Clipboard manager - keep clipboard after app closes
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Set cursor theme (rose-pine-hyprcursor)
exec-once = hyprctl setcursor rose-pine-hyprcursor 24

# Import environment to systemd user session (for screen sharing, etc.)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Optional per-host overrides
source = ~/.config/hypr/autostart.local.conf
