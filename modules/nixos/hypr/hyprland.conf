# Main Hyprland compositor configuration, including layout, theming, animation, and rules.
# Rose Pine Moon theme colors used throughout

# Source modular configs
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/autostart.conf

# General settings
general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2

  # Rose Pine Moon colors
  col.active_border = rgba(c4a7e7ff) rgba(9ccfd8ff) 45deg
  col.inactive_border = rgba(393552aa)

  layout = dwindle
  allow_tearing = false
}

# Decoration
decoration {
  rounding = 8

  blur {
    enabled = true
    size = 6
    passes = 2
    new_optimizations = true
    xray = false
  }

  shadow {
    enabled = true
    range = 15
    render_power = 3
    color = rgba(1a1a2eee)
  }
}

# Animations
animations {
  enabled = true

  bezier = ease, 0.25, 0.1, 0.25, 1
  bezier = easeOut, 0, 0, 0.58, 1
  bezier = easeInOut, 0.42, 0, 0.58, 1

  animation = windows, 1, 4, ease, slide
  animation = windowsOut, 1, 4, easeOut, slide
  animation = fade, 1, 4, ease
  animation = workspaces, 1, 4, easeInOut, slide
  animation = border, 1, 5, ease
  animation = borderangle, 1, 50, ease, loop
}

# Input
input {
  kb_layout = us
  follow_mouse = 1
  sensitivity = 0

  touchpad {
    natural_scroll = true
    tap-to-click = true
  }
}

device[dactyl-pro-52&64-mouse] {
  sensitivity = -0.66
}

# Layout
dwindle {
  pseudotile = true
  preserve_split = true
  force_split = 2
}

master {
  new_status = master
}

# Misc
misc {
  force_default_wallpaper = 0
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  key_press_enables_dpms = true
}

# XWayland
xwayland {
  force_zero_scaling = true
}

# Window rules
# Terminal blur (compositor-side for transparent terminals)
windowrulev2 = opacity 0.95 0.90, class:^(com.mitchellh.ghostty)$

windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(file-roller)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$

# Steam rules
windowrulev2 = float, class:^(steam)$, title:^(Friends List)$
windowrulev2 = float, class:^(steam)$, title:^(Steam Settings)$
windowrulev2 = stayfocused, title:^()$, class:^(steam)$

# Gaming - disable blur/animations for performance
windowrulev2 = immediate, class:^(steam_app_.*)$
windowrulev2 = fullscreen, class:^(steam_app_.*)$

# Layer rules for noctalia-shell
layerrule = blur, noctalia-panel
layerrule = ignorezero, noctalia-panel
layerrule = blur, noctalia-launcher
layerrule = ignorezero, noctalia-launcher
layerrule = blur, noctalia-notifications
layerrule = ignorezero, noctalia-notifications
