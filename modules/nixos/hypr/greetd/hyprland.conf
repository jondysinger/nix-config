# Hyprland config used by the greetd greeter session before handing off to regreet.

# Auto-detect monitors at preferred resolution
monitor = , preferred, auto, 1

exec-once = regreet; hyprctl dispatch exit

# Minimal greeter config
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
}

# Simple styling
general {
  gaps_in = 0
  gaps_out = 0
  border_size = 0
}
